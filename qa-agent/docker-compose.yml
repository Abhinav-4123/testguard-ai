version: '3.8'

services:
  qa-agent:
    build: .
    ports:
      - "8000:8080"
    env_file:
      - .env
    volumes:
      - ./reports:/app/reports
      - ./screenshots:/app/screenshots
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
